name: appsec-poc
on:
  workflow_dispatch:
  schedule: [{cron: "0 3 * * 1"}]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create output directory
        run: mkdir -p out
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master  # pin to a released version or SHA in the client repo
        with: {scan-type: fs, scan-ref: sample-app, format: json, output: out/trivy.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Rank findings and propose fixes (dry run)
        run: python -m pipeline.run --scan out/trivy.json --app sample-app
      - name: Upload to DefectDojo
        if: ${{ vars.DD_URL != '' }}
        env: {DD_URL: "${{ vars.DD_URL }}", DD_TOKEN: "${{ secrets.DD_TOKEN }}"}
        run: python -m pipeline.push_to_defectdojo out/trivy.json --product sample-app
      - uses: actions/upload-artifact@v4
        with: {name: poc-output, path: out/}

  propose-fix:
    needs: scan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: fix  # configure required reviewers on this environment
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: poc-output, path: out/}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Open DRAFT fix pull request
        env: {GH_TOKEN: "${{ github.token }}", ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"}
        run: |
          git config user.name "appsec-poc-agent"; git config user.email "agent@example.com"
          python -m pipeline.run --scan out/trivy.json --app sample-app --apply --open-pr
